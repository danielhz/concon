[server]
host = "0.0.0.0"
port = 3000
# Mark the login session cookie `Secure` (sent over HTTPS only). Default true;
# set to false only for local development over plain http://, otherwise the
# browser never returns the cookie and login appears not to work.
# secure_cookies = true

[store]
# Path to the Turtle file containing system data (users, teams, datasets).
# If this file does not exist on startup, a default one is created with an
# admin user (credentials from MLIPE_ADMIN_USER / MLIPE_ADMIN_PASS env vars,
# or "admin" / "admin").
system_data = "system.ttl"
# Directory for the per-dataset RDF (RocksDB) stores. Required.
data_dir    = "data"
# Directory for uploaded file blobs. Optional; default shown.
# files_dir = "data/files"

[grobid]
# URL of the GROBID service for PDF metadata extraction.
# Leave empty or omit to disable automatic extraction.
url = "http://localhost:8070"
