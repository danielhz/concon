<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Concon{% endblock %}</title>
    <link rel="stylesheet" href="/static/vendor/foundation.min.css">
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-left">
            <ul class="menu">
                <li class="menu-text"><a href="/">Concon</a></li>
                <li><a href="/_teams">Teams</a></li>
                <li><a href="/_users">Users</a></li>
            </ul>
        </div>
        <div class="top-bar-right">
            <ul class="menu">
                {% if username %}
                <li class="menu-text">{{ username }}</li>
                <li><a href="/_change-password">Change password</a></li>
                {% if is_admin %}<li><a href="/_admin">Admin</a></li>{% endif %}
                <li>
                    <form method="post" action="/_logout" class="inline-form">
                        <button type="submit" class="clear button top-bar-logout">Logout</button>
                    </form>
                </li>
                {% else %}
                <li><a href="/_login">Login</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
    <div class="grid-container">
        <div class="grid-x grid-padding-x">
            <div class="cell">
                <main style="padding-top: 1.5rem;">
                    {% block content %}{% endblock %}
                </main>
            </div>
        </div>
    </div>
    <script src="/static/vendor/jquery.min.js"></script>
    <script src="/static/vendor/foundation.min.js"></script>
    <script>$(document).foundation();</script>
    {% block scripts %}{% endblock %}
</body>
</html>
