{% extends "base.html" %}

{% block title %}Concon - Users{% endblock %}

{% block content %}
<h1>Users</h1>
{% if users %}
    <table class="data-table">
        <thead>
            <tr><th>Username</th><th>Teams</th></tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td><a href="/_users/{{ u.username }}">{{ u.username }}</a></td>
                <td>{{ u.teams }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% else %}
    <p>No users found.</p>
{% endif %}
{% endblock %}
