[package]
name = "mlipe"
version = "0.1.0"
edition = "2024"
description = "Machine Learned Interatomic Potentials Environment"
license = "MIT"
default-run = "mlipe"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
oxigraph = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tower-http = { version = "0.6", features = ["cors", "fs"] }
minijinja = { version = "2", features = ["loader"] }
argon2 = "0.5"
tower-cookies = "0.11"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"

[dev-dependencies]
axum-test = "19"
