[package]
name = "concon"
version = "0.1.0"
edition = "2024"
description = "Collaborative knowledge graph platform for teams — manage RDF datasets, share scientific papers, and query with SPARQL"
license = "MIT OR Apache-2.0"
repository = "https://git.degu.cl/daniel/concon"
default-run = "concon"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
oxigraph = { version = "0.5", features = ["rdf-12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tower-http = { version = "0.6", features = ["cors", "fs"] }
minijinja = { version = "2", features = ["loader"] }
# `std` → password-hash/std → rand_core/getrandom, which `auth.rs` needs for `OsRng`.
# Before this was enabled only through a stale `rand 0.8` edge in Cargo.lock.
argon2 = { version = "0.5", features = ["std"] }
tower-cookies = "0.11"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
reqwest = { version = "0.12", features = ["multipart", "blocking"] }
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"

[dev-dependencies]
axum-test = "19"
